<style>
html, body { margin: 0; background: #E6EDF0; }
.tb { --acc: #00732D; --acc-t: #005A23; --tint: #DAF1DC; --ink: #1A1E20; --ink2: #4D5254; --line: #D5DCE0; --sun: #EDF2F5;
  box-sizing: border-box; width: 390px; height: 844px; display: flex; flex-direction: column; background: #fff; color: var(--ink);
  font: 400 15px/21px "IBM Plex Sans", system-ui, -apple-system, Arial, sans-serif; overflow: hidden; position: relative; }
.tb *, .tb *::before, .tb *::after { box-sizing: border-box; }
.tb-st { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px 6px; font: 600 15px/18px "IBM Plex Sans", system-ui, sans-serif; background: #fff; }
.tb-st svg { height: 12px; width: auto; }
.tb-hd { display: flex; align-items: center; gap: 12px; padding: 6px 16px 10px 8px; background: #fff; border-bottom: 1px solid var(--line); }
.tb-hd > .tb-bk { display: grid; place-items: center; width: 40px; height: 40px; color: var(--acc); }
.tb-ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tb-av { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: #fff; font: 600 18px/20px "Geologica", "IBM Plex Sans", sans-serif; flex: none; }
.tb-hd b { display: block; font: 600 16px/20px "Geologica", "IBM Plex Sans", sans-serif; }
.tb-hd span.s { display: block; color: var(--ink2); font-size: 13px; line-height: 16px; }
.tb-feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 12px 8px; background: #E4EEE8; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
.tb-day { align-self: center; padding: 2px 10px; border-radius: 12px; background: rgba(26,30,32,.28); color: #fff; font-size: 13px; line-height: 18px; }
.tb-m { max-width: 86%; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.tb-m--b { align-self: flex-start; }
.tb-m--m { align-self: flex-end; }
.tb-bub { padding: 8px 12px 6px; border-radius: 14px; background: #fff; box-shadow: 0 1px 1px rgba(26,30,32,.08); overflow-wrap: anywhere; }
.tb-m--b .tb-bub { border-bottom-left-radius: 4px; }
.tb-m--m .tb-bub { background: var(--tint); border-bottom-right-radius: 4px; }
.tb-k { display: block; font: 600 12px/16px "IBM Plex Sans", sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--acc-t); margin-bottom: 2px; }
.tb-h { display: block; font-weight: 600; }
.tb-t { white-space: pre-line; }
.tb-tm { display: block; text-align: right; color: var(--ink2); font-size: 12px; line-height: 16px; margin-top: 2px; }
.tb-pg { height: 6px; border-radius: 3px; background: var(--sun); overflow: hidden; margin: 8px 0 2px; }
.tb-pg i { display: block; height: 100%; background: var(--acc); }
.tb-cd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); margin-top: 6px; }
.tb-cd b { font: 600 15px/18px "IBM Plex Sans", sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); }
.tb-kb { display: flex; flex-wrap: wrap; gap: 4px; }
.tb-btn { flex: 1 1 calc(50% - 2px); min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 10px; background: rgba(255,255,255,.92); color: var(--acc-t); font: 600 14px/18px "IBM Plex Sans", sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 1px 1px rgba(26,30,32,.08); text-align: center; }
.tb-btn:hover { background: #fff; }
.tb-btn.is-full { flex-basis: 100%; }
.tb-btn.is-on { background: var(--acc); color: #fff; }
.tb-btn.is-off { opacity: .5; cursor: default; }
.tb-btn .tb-ic { width: 16px; height: 16px; }
.tb-bot { background: var(--sun); border-top: 1px solid var(--line); padding: 8px 12px 10px; display: grid; gap: 8px; }
.tb-in { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; }
.tb-in input { min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; background: #fff; font: 400 15px/21px "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); outline: none; }
.tb-in input:focus { border-color: var(--acc); }
.tb-in button { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--acc); color: #fff; cursor: pointer; }
.tb-rk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tb-rk button { min-height: 44px; border: 0; border-radius: 10px; background: #fff; color: var(--ink); font: 500 14px/18px "IBM Plex Sans", sans-serif; cursor: pointer; box-shadow: 0 1px 1px rgba(26,30,32,.12); }
.tb-rk button:hover { background: var(--tint); }
.tb-aw { color: var(--acc-t); font-size: 13px; line-height: 18px; }
</style>
<style id="hb-fix-sys-2211">/* Свод 22.11, системные правки по аудиту: один блок на все живые экраны. Источник правды для <style id="hb-fix-sys-2211">. .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent (18 повторов .hb) и .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent (22 повтора .hb, для правил, что должны перебивать групповые блоки и gk) подставляются при сборке. */

/* 1. Шапка -> первый блок 16 (телефон 12); лид вплотную, ink-2 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp { row-gap: 16px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp > .phead { margin-bottom: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .phead__main > h1 + :is(p, .lead) { margin-top: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .phead__main > :is(p, .lead) { color: var(--hb-ink-2); }
@media (max-width: 767px) { .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp { row-gap: 12px; } }

/* 2. Заголовок блока 18/24 Geologica 600; под ним 8-12 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-t, .sp-tit, .k2-h, .gd-late > h2, .netlink__ttl) { font: 600 18px/24px var(--font-display); letter-spacing: 0; color: var(--hb-ink); }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .pv-pop__h > b { font: 600 18px/24px var(--font-display); letter-spacing: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .netlink__ttl + * { margin-top: 6px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp-tit :is(h2, h3) { margin: 0; font: inherit; letter-spacing: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(h2, h3).sp-tit { font: 600 18px/24px var(--font-display) !important; }

/* 3. Карточка: r16 (вложенное 14), padding 22 (телефон 18), рамка 1px line, без тени */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-side, .sp-card, .k2-sec, .gd-ev, .gd-late, .rcard, .dpath, .panel.inv-link, .linkhero, .hl-card, .ocard, .pcard, .k2-next, .k2-contact, .notice, .kk-li, .k2-lr, .dpath__m, .thread__d) { box-shadow: none; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-side, .sp-card, .k2-sec, .gd-ev, .gd-late, .rcard, .dpath, .panel.inv-link, .linkhero, .hl-card, .ocard) { border-radius: 16px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-side, .sp-card, .k2-sec, .gd-ev, .gd-late, .rcard, .dpath, .panel.inv-link, .linkhero) { padding: 22px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.rz-tbl, .lrows, .k2-lrs, .kk-th, .pf-acc) { border-radius: 14px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.sstrip, .sstrip--lg) { border-radius: 16px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.k2-contact, .kk-li, .notice, .k2-next) { border-radius: 14px; }
/* карточка в карточке: внутри секции без своей рамки, фон sunken */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.k2-sec, .pv-side, .gd-late) :is(.k2-contact, .kk-li) { border-color: transparent; background: var(--hb-sunken); }

.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .plist > .pcard + .pcard { border-top: 1px solid var(--hb-line); }
@media (max-width: 767px) {
  .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-side, .sp-card, .k2-sec, .gd-ev, .gd-late, .rcard, .dpath, .panel.inv-link, .linkhero) { padding: 18px; }
}

/* 4. Кнопки: 32 -> r10, 40 -> r12; 48 нет; телефон 40 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .btn { border-radius: 10px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.phead__acts, .modal__foot, .pt-acts, .kab__head) .btn:not(.btn--s, .btn--icon) { border-radius: 12px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .btn--acc.btn--l { border-radius: 10px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.btn--round, .mcomp .btn, .copy--code .btn, .agm__f .btn) { border-radius: 12px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.phead__acts, .modal__foot, .pt-acts) .btn--acc.btn--l { border-radius: 12px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .k2-next .btn--l { min-height: 32px; height: 32px; }

  .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.btn, .btn--s, .btn--acc.btn--l) { border-radius: 12px; min-height: 40px; }
  .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(button.btn--link, .k2-lnk, .rowopen, .pcard__t, .pt-stretch, .fl__h, .kk-hl__r, .x-lnk, .crumbs__b) { min-height: 40px; display: inline-flex; align-items: center; }
  .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .fl__h { display: grid; }

}

/* 5. Поля и триггеры 40 на десктопе; метка -> поле 6; между полями 16 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.k2-flt__s .input, .input--t, .cs__btn, .kk-dd .cs__btn, .fbar .cs__btn) { height: 40px; min-height: 40px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.k2-flt, .fbar) :is(.btn, .btn--s, .btn--quiet):not(.btn--icon) { min-height: 40px; }

.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-modal, .sp-card, .field) .fbtn { height: 40px; min-height: 40px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp-two { row-gap: 16px; }
@media (min-width: 768px) { .hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.linkhero, .netlink) .copy--code .input { font-size: 16px; line-height: 24px; } }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.sp-card .sp-two, .sp-card form, .sp-card .stack) { row-gap: 16px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sp-card .field + .field { margin-top: 0; }

/* 6. Окна: не выше экрана, тело прокручивается, шапка и подвал на месте; ширина 440-560 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-modal, .k3-win) { max-height: calc(100dvh - 48px) !important; overflow: hidden !important; display: flex; flex-direction: column; box-sizing: border-box; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-modal, .k3-win) > .modal__in { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }

.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-modal, .k3-win) .modal__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.pv-modal, .k3-win) .modal__foot { margin-top: 0 !important; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .kl-modal { max-height: calc(100dvh - 48px) !important; overflow-y: auto !important; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .kl-modal .modal__head { position: sticky; top: 0; z-index: 3; background: var(--hb-paper); }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .kl-modal .pt-acts { position: sticky; bottom: 0; z-index: 3; background: var(--hb-paper); padding-block: 12px 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .kl-modal.pt-wiz { width: min(560px, 100%); max-width: 560px; }

/* 7. Значки в кнопках: 16 в кнопках 32, 20 в кнопках 40 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .btn svg { width: 16px; height: 16px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.phead__acts, .modal__foot, .pt-acts) .btn svg { width: 20px; height: 20px; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.phead__acts, .modal__foot, .pt-acts) .btn--icon svg { width: 20px; height: 20px; }

.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .search :is(.ic, svg) { width: 20px; height: 20px; }

/* 8. Бейджи 12 мягкие без капса; th 13/18 600 ink-3 */
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent :is(.badge, .cnt-pill, .dlg__tag, .dlg__u, .ocard__tag) { font-size: 12px; line-height: 16px; text-transform: none; letter-spacing: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent th { font: 600 13px/18px var(--font-ui); color: var(--hb-ink-3); text-transform: none; letter-spacing: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .k2-next__l { text-transform: none; letter-spacing: 0; }
.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent .sstrip small { font: 400 12px/16px var(--font-ui); color: var(--hb-ink-3); }

.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.hb.kab--agent main.kab__main { row-gap: 16px; }

    if (bid.indexOf("d:") === 0) { const d = bid.slice(2); return go([this.me(d), this.bot({ t: "Во сколько?", lock: true, btns: ["10:00", "12:00", "15:00", "18:00"].map(t => ({ id: "t:" + t, l: t })).concat([{ id: "tin:d", l: "Ввести время", full: true }]) })], { ctx: ctx({ day: d }) }); }
    if (bid.indexOf("tin:") === 0) { const k = bid.slice(4); return go([this.me("Ввести время"), this.bot({ t: "Напишите время, например 14:30." + (S.ctx.cal === false ? "" : "\nЯ сверю его с календарём.") })], { aw: "time", ctx: ctx({ tk: k }) }); }
    if (bid.indexOf("tt:") === 0) { const t = bid.slice(3); return go([this.me(label), this.bot(this.saved(t))], { ctx: ctx({}) }); }
    if (bid.indexOf("t:") === 0) { const t = bid.slice(2), c = S.ctx; return go([this.me(t), this.bot({ h: "Записано", t: (c.act || "Действие") + ": " + (c.rep || "отчёт сохранён") + "\nСледующее действие: " + (c.day || "") + ", " + t + ".\nДобавлено в Google Календарь.\nВидят агент и партнёрский отдел." })], { ctx: ctx({}) }); }
    if (bid === "done") return go([this.me("Сделано"), this.bot({ t: "Отметил звонок выполненным. Добавьте отчёт.", btns: [{ id: "act", l: "Записать действие" }] })], { ctx: ctx({ cur: "HB-10344 Георгий Мелия" }) });
    if (bid === "mv") return go([this.me("Перенести"), this.bot({ t: "На когда?", lock: true, btns: [{ id: "m:через час, 15:48", l: "Через час" }, { id: "m:сегодня, 18:00", l: "Сегодня 18:00" }, { id: "m:завтра, 10:00", l: "Завтра 10:00" }, { id: "tin:m", l: "Ввести время", full: true }] })]);
    if (bid.indexOf("m:") === 0) { const w = bid.slice(2); return go([this.me(label), this.bot({ h: "Перенесено", t: "Звонок Георгию Мелия: " + w + ".\nНапомню за 30 минут." })]); }
    if (bid === "rcl") return go([this.me("Ответить"), this.bot({ t: "Напишите ответ клиенту. Уйдёт в WhatsApp." })], { aw: "rcl", ctx: ctx({ cur: "HB-10344 Георгий Мелия" }) });
    if (bid === "rag") return go([this.me("Ответить"), this.bot({ t: "Напишите агенту Марату. Он увидит в чате кабинета." })], { aw: "rag" });
  }
  onDraft(e) { this.setState({ draft: e.target.value }); }
  onKey(e) { if (e && e.key === "Enter") this.send(); }
  send() {
    const S = this.state, text = (S.draft || "").trim();
    if (!text) { this.add([this.bot({ t: S.aw ? "Текст обязателен, напишите его." : "Выберите кнопку ниже." })]); return; }
    const m = this.me(text), c = S.ctx, p = { draft: "", aw: "" };
    if (S.aw === "time") {
      const mt = /^([01]?\d|2[0-3])[:.]?([0-5]\d)$/.exec(text);
      if (!mt) return this.add([m, this.bot({ t: "Не понял время. Напишите ЧЧ:ММ, например 14:30." })], { draft: "" });
      const s = +mt[1] * 60 + +mt[2], tt = this.fmt(s), day = c.tk === "m" ? "Сегодня" : (c.day || "Сегодня"), hit = this.busyOf(day).find(b => s < b[1] && s + 30 > b[0]);
      if (!hit) return this.add([m, this.bot(this.saved(tt))], { draft: "", aw: "", ctx: Object.assign({}, c, {}) });
      let free = s; while (free + 30 <= 1200 && this.busyOf(day).some(b => free < b[1] && free + 30 > b[0])) free += 5;
      return this.add([m, this.bot({ h: "Пересекается", t: this.fmt(hit[0]) + " " + hit[2] + ".\nБлижайшее свободное: " + this.fmt(free) + ".", lock: true, btns: [{ id: "tt:" + this.fmt(free), l: "Записать на " + this.fmt(free) }, { id: "tt:" + tt, l: "Всё равно на " + tt }] })], { draft: "", aw: "" });
    }
    if (S.aw === "stcom") return this.add([m, this.bot({ h: "Записано", t: "Этап: " + c.stage + ", " + this.cur() + ".\nВидят агент и партнёрский отдел." })], p);
    if (S.aw === "rep") return this.add([m, this.bot({ t: "Отчёт принят. Когда следующее действие?", lock: true, btns: [{ id: "d:Сегодня", l: "Сегодня" }, { id: "d:Завтра", l: "Завтра" }, { id: "d:Пн 24 ноя", l: "Пн 24 ноя" }, { id: "d:Вт 25 ноя", l: "Вт 25 ноя" }] })], Object.assign(p, { ctx: Object.assign({}, c, { rep: text }) }));
    if (S.aw === "rcl") return this.add([m, this.bot({ h: "Отправлено", t: "WhatsApp, Георгий Мелия. Статус: доставлено." })], p);
    if (S.aw === "rag") return this.add([m, this.bot({ h: "Отправлено", t: "Марату Сулейманову, в чат кабинета." })], p);
    this.add([m, this.bot({ t: "Выберите кнопку ниже." })], p);
  }
  busyOf(day) { const B = { "Сегодня": [[900, 960, "Показ, Анна Белова"], [1110, 1170, "Занято (личное)"]], "Завтра": [[660, 690, "Созвон, Тимур Касымов"], [780, 840, "Занято (личное)"]] }; return B[day] || []; }
  fmt(t) { return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
  saved(t) { const c = this.state.ctx; return c.tk === "m" ? { h: "Перенесено", t: "Звонок Георгию Мелия: " + (c.mday || "сегодня") + ", " + t + ".\nНапомню за 30 минут.\nДобавлено в Google Календарь." } : { h: "Записано", t: (c.act || "Действие") + ": " + (c.rep || "отчёт сохранён") + "\nСледующее действие: " + (c.day || "") + ", " + t + ".\nДобавлено в Google Календарь.\nВидят агент и партнёрский отдел." }; }
  kbList() { this.add([this.me("Заявки"), this.bot({ h: "Ваши заявки", t: "HB-10436 Ольга Громова, новая\nHB-10431 Дмитрий Орлов, новая\nHB-10398 Нина Фёдорова, в работе", btns: [{ id: "cab", l: "Открыть в кабинете", href: "klienty.dc.html", full: true }] })]); }
  kbStage() { this.press("", "stg", "", [this.me("Этап")]); }
  kbAct() { this.press("", "act", "", [this.me("Действие")]); }
  renderVals() {
    const S = this.state, mm = String(Math.floor(S.sec / 60)).padStart(2, "0") + ":" + String(S.sec % 60).padStart(2, "0");
    const feed = S.msgs.map(m => {
      if (m.day) return { isDay: true, isMsg: false, day: m.day };
      const r = { isDay: false, isMsg: true, cls: m.side === "b" ? "tb-m--b" : "tb-m--m", k: m.k || "", h: m.h || "", t: m.t || "", time: m.time, cd: "", cdl: "", pg: "" };
      if (m.tm) { r.cd = S.req === "pending" ? mm : ({ taken: "Принята", declined: "Отклонена", expired: "Время вышло" })[S.req]; r.cdl = S.req === "pending" ? "Осталось" : "Статус"; r.pg = "width:" + (S.req === "pending" ? Math.round(S.sec / 9) : 0) + "%"; }
      const bs = m.btns || []; r.hasB = bs.length > 0;
      for (let k = 1; k <= 6; k++) {
        const b = bs[k - 1]; const on = b && (m.done === b.id), off = b && ((m.done && m.done !== b.id) || (m.tm && S.req !== "pending" && !on && b.id !== "cab"));
        r["b" + k + "l"] = b ? b.l : ""; r["b" + k + "x"] = !!b && b.id === "decl"; r["b" + k + "h"] = b && b.href ? b.href : ""; r["b" + k + "n"] = !!b && !b.href;
        r["b" + k + "c"] = b ? ((b.full ? "is-full " : "") + (on ? "is-on " : "") + (off ? "is-off" : "")).trim() : "";
        r["b" + k + "f"] = () => b && !b.href && this.press(m.id, b.id, b.l);
      }
      return r;
    });
    const ph = { stcom: "Комментарий", rep: "Отчёт", rcl: "Ответ клиенту", rag: "Ответ агенту", time: "ЧЧ:ММ" }[S.aw] || "Сообщение";
    const awT = { stcom: "Нужен комментарий к этапу", rep: "Нужен отчёт о действии", rcl: "Пишете клиенту в WhatsApp", rag: "Пишете агенту", time: "Нужно время, ЧЧ:ММ" }[S.aw] || "";
    return { clock: this.now(), feed, ph, hasAw: !!S.aw, awText: awT, draft: S.draft, onDraft: (e) => this.onDraft(e), onKey: (e) => this.onKey(e), send: () => this.send(), kbList: () => this.kbList(), kbStage: () => this.kbStage(), kbAct: () => this.kbAct() };
  }
}
